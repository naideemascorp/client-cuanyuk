[package]
name = "client-cuanyuk"
version = "1.0.0"
authors = ["you"]
edition = "2024"
rust-version = "1.92.0"

[lib]
name = "client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2.5.3" }

[dependencies]
log = "0.4.29"
tauri = { version = "2.9.5" }
tauri-plugin-log = "2.8.0"
